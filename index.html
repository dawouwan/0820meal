<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>와우 | 밥집 찾기</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00f0ff;
    --magenta: #ff2ec4;
    --cyan-rgb: 0, 240, 255;
    --magenta-rgb: 255, 46, 196;
    --ink: #f5faff;
    --bg-1: #111a37;
    --bg-2: #08112e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: 'Space Mono', ui-monospace, monospace;
    background: var(--bg-2);
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 40px 20px;
    background:
      radial-gradient(120% 90% at 50% 38%, rgba(var(--cyan-rgb), 0.07), transparent 60%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
    overflow: hidden;
  }

  .logo-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-grid {
    display: grid;
    grid-template-columns: repeat(2, auto);
    row-gap: 0;
    column-gap: 6px;
    justify-content: center;
    justify-items: end;
    align-items: center;
    line-height: 0.8;
  }
  .logo-grid.fuse {
    row-gap: -26px;
  }
  .ch {
    font-family: 'Black Han Sans', 'Malgun Gothic', sans-serif;
    font-size: clamp(84px, 22vw, 168px);
    color: transparent;
    -webkit-text-stroke: 3px var(--c);
    letter-spacing: 0;
    user-select: none;
  }
  .ch.cyan {
    --c: var(--cyan);
    text-shadow:
      0 0 2px rgba(255,255,255,0.85),
      0 0 10px rgba(var(--cyan-rgb), 0.85),
      0 0 22px rgba(var(--cyan-rgb), 0.55),
      0 0 46px rgba(var(--cyan-rgb), 0.3),
      0 0 90px rgba(var(--cyan-rgb), 0.16);
    animation: neon-flicker 5s ease-in-out infinite;
  }
  .ch.magenta {
    --c: var(--magenta);
    text-shadow:
      0 0 2px rgba(255,255,255,0.85),
      0 0 10px rgba(var(--magenta-rgb), 0.85),
      0 0 22px rgba(var(--magenta-rgb), 0.55),
      0 0 46px rgba(var(--magenta-rgb), 0.3),
      0 0 90px rgba(var(--magenta-rgb), 0.16);
    animation: neon-flicker 5s ease-in-out infinite;
    animation-delay: -2.4s;
  }
  @keyframes neon-flicker {
    0%, 100% { filter: brightness(1); }
    3% { filter: brightness(0.85); }
    6% { filter: brightness(1); }
    7% { filter: brightness(0.9); }
    8% { filter: brightness(1); }
    50% { filter: brightness(1.05); }
    52% { filter: brightness(0.95); }
    54% { filter: brightness(1); }
  }

  .tagline {
    color: rgba(245, 250, 255, 0.6);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-align: center;
    width: 100%;
    max-width: 360px;
    white-space: nowrap;
  }

  .auth-box {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .auth-tabs {
    display: flex;
    border: 1px solid rgba(var(--cyan-rgb), 0.4);
  }
  .auth-tab {
    flex: 1;
    background: transparent;
    border: none;
    color: rgba(245, 250, 255, 0.55);
    font-family: 'Space Mono', ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 12px 0;
    cursor: pointer;
  }
  .auth-tab + .auth-tab {
    border-left: 1px solid rgba(var(--cyan-rgb), 0.4);
  }
  .auth-tab[aria-pressed="true"] {
    background: rgba(var(--cyan-rgb), 0.14);
    color: var(--ink);
  }

  .auth-field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--cyan);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .auth-field input {
    width: 100%;
    background: rgba(245, 250, 255, 0.04);
    border: 1px solid rgba(var(--cyan-rgb), 0.35);
    color: var(--ink);
    padding: 12px 14px;
    font-family: 'Space Mono', ui-monospace, monospace;
    font-size: 14px;
    border-radius: 2px;
  }
  .auth-field input:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(var(--cyan-rgb), 0.35);
  }

  .auth-error {
    color: var(--magenta);
    font-size: 12px;
    letter-spacing: 0.03em;
  }

  .auth-submit {
    appearance: none;
    background: transparent;
    color: var(--ink);
    border: 2px solid var(--cyan);
    padding: 14px 0;
    width: 100%;
    font-family: 'Space Mono', ui-monospace, monospace;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-radius: 2px;
    box-shadow: 0 0 12px rgba(var(--cyan-rgb), 0.35);
    transition: background 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
  }
  .auth-submit:hover {
    background: rgba(var(--cyan-rgb), 0.12);
    box-shadow: 0 0 22px rgba(var(--cyan-rgb), 0.6);
  }
  .auth-submit:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .guest-link {
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: rgba(245, 250, 255, 0.4);
    text-decoration: none;
  }
  .guest-link:hover {
    color: var(--cyan);
  }
</style>
</head>
<body>

  <div class="logo-wrap">
    <div class="logo-grid fuse">
      <span class="ch cyan">W</span><span class="ch magenta">와</span>
      <span class="ch cyan">우</span><span class="ch magenta">W</span>
    </div>
  </div>

  <p class="tagline">내 주변 밥집을 찾아보세요</p>

  <form id="auth-form" class="auth-box">
    <div class="auth-tabs">
      <button type="button" class="auth-tab" data-mode="login" aria-pressed="true">로그인</button>
      <button type="button" class="auth-tab" data-mode="register" aria-pressed="false">회원가입</button>
    </div>

    <div class="auth-field">
      <label for="auth-email">이메일</label>
      <input id="auth-email" type="email" required autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="auth-field">
      <label for="auth-password">비밀번호</label>
      <input id="auth-password" type="password" required autocomplete="current-password" placeholder="비밀번호">
    </div>

    <p id="auth-error" class="auth-error" hidden></p>

    <button id="auth-submit" type="submit" class="auth-submit">&gt; 로그인</button>
  </form>

  <a class="guest-link" href="main.html">로그인 없이 둘러보기 &gt;</a>

  <script type="module">
    import { signIn, signUp } from './auth.js';

    const form = document.getElementById('auth-form');
    const tabs = form.querySelectorAll('.auth-tab');
    const emailInput = document.getElementById('auth-email');
    const passwordInput = document.getElementById('auth-password');
    const errorEl = document.getElementById('auth-error');
    const submitBtn = document.getElementById('auth-submit');

    let mode = 'login';

    function applyMode() {
      const isRegister = mode === 'register';
      tabs.forEach((tab) => tab.setAttribute('aria-pressed', String(tab.dataset.mode === mode)));
      passwordInput.autocomplete = isRegister ? 'new-password' : 'current-password';
      submitBtn.textContent = isRegister ? '> 회원가입' : '> 로그인';
      errorEl.hidden = true;
    }

    tabs.forEach((tab) => tab.addEventListener('click', () => {
      mode = tab.dataset.mode;
      applyMode();
    }));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      submitBtn.disabled = true;

      const result = mode === 'register'
        ? await signUp(emailInput.value, passwordInput.value)
        : await signIn(emailInput.value, passwordInput.value);

      if (!result.ok) {
        errorEl.textContent = result.error;
        errorEl.hidden = false;
        submitBtn.disabled = false;
        return;
      }

      window.location.href = 'main.html';
    });

    // 태그라인을 로그인/회원가입 버튼 줄과 끝과 끝이 맞도록 폰트 크기를 스케일.
    function fitTagline() {
      const tagline = document.querySelector('.tagline');
      const target = document.querySelector('.auth-tabs');
      if (!tagline || !target) return;
      const targetWidth = target.getBoundingClientRect().width;
      if (!targetWidth) return;
      tagline.style.fontSize = '18px';
      const currentWidth = tagline.getBoundingClientRect().width;
      if (!currentWidth) return;
      const newSize = 18 * (targetWidth / currentWidth);
      tagline.style.fontSize = `${newSize}px`;
    }
    window.addEventListener('load', fitTagline);
    window.addEventListener('resize', fitTagline);
  </script>

</body>
</html>
