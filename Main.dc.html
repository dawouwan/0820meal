<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Mono:wght@400;700&display=swap">
  <style>
    :root {
      --cyan: #00f0ff;
      --magenta: #ff2ec4;
      --cyan-rgb: 0, 240, 255;
      --magenta-rgb: 255, 46, 196;
      --ink: #f5faff;
      --bg-1: #111a37;
      --bg-2: #08112e;
    }
    body {
      margin: 0;
      font-family: 'Space Mono', ui-monospace, monospace;
      background: var(--bg-2);
    }
    a { color: var(--cyan); }
    a:hover { color: var(--magenta); }

    .stage {
      position: relative;
      width: 100%;
      min-height: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 60px 20px 40px;
      background:
        radial-gradient(120% 90% at 50% 38%, rgba(var(--cyan-rgb), 0.07), transparent 60%),
        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
      overflow: hidden;
    }

    .logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-grid {
      display: grid;
      grid-template-columns: repeat(2, auto);
      row-gap: 0;
      column-gap: 6px;
      justify-content: center;
      justify-items: end;
      align-items: center;
      line-height: 0.8;
    }
    /* pulls each column's stacked pair (와 over W, W over 우) into one continuous
       tube instead of two floating glyphs — right edges now share a column, so
       와's ㅏ stroke lands on the same line as the W outer stroke beneath it */
    .logo-grid.fuse {
      row-gap: -26px;
    }
    .ch {
      font-family: 'Black Han Sans', 'Malgun Gothic', sans-serif;
      font-size: 168px;
      color: transparent;
      -webkit-text-stroke: 3px var(--c);
      letter-spacing: 0;
      user-select: none;
    }
    .ch.cyan {
      --c: var(--cyan);
      text-shadow:
        0 0 2px rgba(255,255,255,0.85),
        0 0 10px rgba(var(--cyan-rgb), 0.85),
        0 0 22px rgba(var(--cyan-rgb), 0.55),
        0 0 46px rgba(var(--cyan-rgb), 0.3),
        0 0 90px rgba(var(--cyan-rgb), 0.16);
      animation: neon-flicker 5s ease-in-out infinite;
    }
    .ch.magenta {
      --c: var(--magenta);
      text-shadow:
        0 0 2px rgba(255,255,255,0.85),
        0 0 10px rgba(var(--magenta-rgb), 0.85),
        0 0 22px rgba(var(--magenta-rgb), 0.55),
        0 0 46px rgba(var(--magenta-rgb), 0.3),
        0 0 90px rgba(var(--magenta-rgb), 0.16);
      animation: neon-flicker 5s ease-in-out infinite;
      animation-delay: -2.4s;
    }
    @keyframes neon-flicker {
      0%, 100% { filter: brightness(1); }
      3% { filter: brightness(0.85); }
      6% { filter: brightness(1); }
      7% { filter: brightness(0.9); }
      8% { filter: brightness(1); }
      50% { filter: brightness(1.05); }
      52% { filter: brightness(0.95); }
      54% { filter: brightness(1); }
    }

    .spark-burst { position: absolute; pointer-events: none; overflow: visible; }
    .spark-burst .bolt {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      animation-name: bolt-flash;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    .spark-burst .core {
      opacity: 0;
      animation-name: bolt-flash;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    .spark-burst .bit {
      opacity: 0;
      animation-name: bit-fly;
      animation-timing-function: cubic-bezier(.15,.7,.3,1);
      animation-iteration-count: infinite;
    }
    /* sharp electric attack, ragged multi-flicker decay — not a smooth sine pulse */
    @keyframes bolt-flash {
      0%     { opacity: 0; }
      1.5%   { opacity: 1; }
      4%     { opacity: 0.2; }
      6%     { opacity: 0.9; }
      9%     { opacity: 0.1; }
      12%    { opacity: 0.6; }
      16%    { opacity: 0; }
      100%   { opacity: 0; }
    }
    @keyframes bit-fly {
      0%   { opacity: 0; transform: translate(0, 0) scale(1); }
      2%   { opacity: 1; transform: translate(0, 0) scale(1); }
      9%   { opacity: 0.8; transform: translate(var(--dx), var(--dy)) scale(0.4); }
      16%  { opacity: 0; transform: translate(calc(var(--dx) * 1.3), calc(var(--dy) * 1.3)) scale(0.1); }
      100% { opacity: 0; }
    }
    .spark-cyan .bolt, .spark-cyan .core, .spark-cyan .bit { stroke: var(--cyan); fill: var(--cyan); filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px var(--cyan)) drop-shadow(0 0 14px var(--cyan)); }
    .spark-magenta .bolt, .spark-magenta .core, .spark-magenta .bit { stroke: var(--magenta); fill: var(--magenta); filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px var(--magenta)) drop-shadow(0 0 14px var(--magenta)); }

    .usage-row {
      padding: 28px 20px 34px;
      background: var(--bg-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .header-bar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 22px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
      border: 1px solid rgba(var(--cyan-rgb), 0.16);
    }
    .header-bar .logo-grid { column-gap: 2px; }
    .header-bar .ch { font-size: 26px; -webkit-text-stroke-width: 1.1px; }
    .header-bar .ch.cyan {
      text-shadow: 0 0 1px #fff, 0 0 4px rgba(var(--cyan-rgb), 0.85), 0 0 10px rgba(var(--cyan-rgb), 0.5);
      animation: none;
    }
    .header-bar .ch.magenta {
      text-shadow: 0 0 1px #fff, 0 0 4px rgba(var(--magenta-rgb), 0.85), 0 0 10px rgba(var(--magenta-rgb), 0.5);
      animation: none;
    }
    .nav-sample {
      font-size: 12px;
      letter-spacing: 0.06em;
      color: rgba(245, 250, 255, 0.55);
    }
    .usage-label {
      font-size: 11px;
      letter-spacing: 0.05em;
      color: rgba(245, 250, 255, 0.35);
    }
  </style>
</helmet>

<div class="stage">
  <div class="logo-wrap">

      <span class="ch cyan">W</span><span class="ch magenta">와</span>
      <span class="ch cyan">우</span><span class="ch magenta">W</span>
    </div>

    <svg class="spark-burst spark-cyan" style="top: -16px; right: 84px; width: 56px; height: 56px;" viewBox="0 0 44 44">

      <path class="bolt" d="M22,22 L20,17 L23,12 L19,7" stroke-width="1.4" transform="rotate(132 22 22)" style="animation-duration:2.8s; animation-delay:-0.32s"/>
      <path class="bolt" d="M22,22 L24,16 L21,11 L24,6" stroke-width="1.2" transform="rotate(196 22 22)" style="animation-duration:2.8s; animation-delay:-0.06s"/>
      <path class="bolt" d="M22,22 L20,16 L23,10 L20,4" stroke-width="1.4" transform="rotate(261 22 22)" style="animation-duration:2.8s; animation-delay:-0.24s"/>

      <circle class="bit" cx="22" cy="22" r="0.9" style="--dx:-9px; --dy:15px; animation-duration:2.8s; animation-delay:-0.32s"/>
      <circle class="bit" cx="22" cy="22" r="0.7" style="--dx:17px; --dy:7px; animation-duration:2.8s; animation-delay:-0.06s"/>
    </svg>
    <svg class="spark-burst spark-magenta" style="bottom: 8px; left: 66px; width: 44px; height: 44px;" viewBox="0 0 44 44">
      <path class="bolt" d="M22,22 L21,16 L24,12 L22,6" stroke-width="1.4" transform="rotate(20 22 22)" style="animation-duration:3.2s; animation-delay:-1.4s"/>
      <path class="bolt" d="M22,22 L24,17 L20,13 L24,8" stroke-width="1.2" transform="rotate(96 22 22)" style="animation-duration:3.2s; animation-delay:-1.58s"/>

      <path class="bolt" d="M22,22 L23,15 L20,10 L23,4" stroke-width="1.1" transform="rotate(244 22 22)" style="animation-duration:3.2s; animation-delay:-1.5s"/>
      <circle class="core" cx="22" cy="22" r="1.8" style="animation-duration:3.2s; animation-delay:-1.42s"/>
      <circle class="bit" cx="22" cy="22" r="0.9" style="--dx:11px; --dy:-14px; animation-duration:3.2s; animation-delay:-1.4s"/>
      <circle class="bit" cx="22" cy="22" r="0.7" style="--dx:-13px; --dy:9px; animation-duration:3.2s; animation-delay:-1.58s"/>
      <circle class="bit" cx="22" cy="22" r="0.8" style="--dx:14px; --dy:12px; animation-duration:3.2s; animation-delay:-1.72s"/>
    </svg>
    <svg class="spark-burst spark-cyan" style="top: 55%; right: -10px; width: 30px; height: 30px;" viewBox="0 0 44 44">
      <path class="bolt" d="M22,22 L21,17 L23,13 L21,8" stroke-width="1.1" transform="rotate(-30 22 22)" style="animation-duration:2.3s; animation-delay:-0.7s"/>
      <path class="bolt" d="M22,22 L23,18 L20,14 L23,9" stroke-width="1" transform="rotate(90 22 22)" style="animation-duration:2.3s; animation-delay:-0.86s"/>
      <path class="bolt" d="M22,22 L20,17 L23,13 L19,9" stroke-width="1" transform="rotate(205 22 22)" style="animation-duration:2.3s; animation-delay:-0.78s"/>
      <circle class="core" cx="22" cy="22" r="1.4" style="animation-duration:2.3s; animation-delay:-0.72s"/>
      <circle class="bit" cx="22" cy="22" r="0.6" style="--dx:-9px; --dy:-8px; animation-duration:2.3s; animation-delay:-0.7s"/>
      <circle class="bit" cx="22" cy="22" r="0.6" style="--dx:8px; --dy:9px; animation-duration:2.3s; animation-delay:-0.86s"/>
    </svg>
  </div>
</div>

<div class="usage-row">
  <div class="header-bar">
    <div class="logo-grid">
      <span class="ch cyan">W</span><span class="ch magenta">와</span>
      <span class="ch cyan">우</span><span class="ch magenta">W</span>
    </div>
    <div class="nav-sample">홈&nbsp;&nbsp;·&nbsp;&nbsp;지도&nbsp;&nbsp;·&nbsp;&nbsp;담아둔 맛집</div>
  </div>
  <div class="usage-label">헤더 사용 예시 — 배경 위에 박스 없이 바로 배치</div>
</div>
</x-dc>
</body>
</html>
